<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - IMC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculadora">
        <h1>Calculadora - IMC</h1>

        <form id="form-imc" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome" 
                    placeholder="Digite seu nome" 
                    autocomplete="name" 
                    required
                >
            </div>

            <div class="campo">
                <label for="altura">Altura</label>
                <input 
                    type="number" 
                    id="altura" 
                    name="altura" 
                    step="0.01" 
                    min="0.5" 
                    max="2.8" 
                    inputmode="decimal" 
                    placeholder="Ex: 1.75" 
                    required
                >
            </div>

            <div class="campo">
                <label for="peso">Peso</label>
                <input 
                    type="number" 
                    id="peso" 
                    name="peso" 
                    step="0.1" 
                    min="2" 
                    max="500" 
                    inputmode="decimal" 
                    placeholder="Ex: 70.5" 
                    required
                >
            </div>

            <button type="submit" id="calcular">Calcular</button>
        </form>

        <div class="resultado">
            <div class="valor" id="valor" aria-live="polite">--</div>
        </div>
    </main>

    <script src="imc.js"></script>
</body>
</html>
