<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lâmpada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="lampada" id="lampada">
    <div class="bulbo"></div>
    <div class="base"></div>

    <!-- Cacos (aparecem quando quebra) -->
    <div class="cacos">
      <div class="caco c1"></div>
      <div class="caco c2"></div>
      <div class="caco c3"></div>
      <div class="caco c4"></div>
      <div class="caco c5"></div>
    </div>
  </div>

  <div class="controles">
    <button class="btn btn-ligar"    id="btnLigar">LIGAR</button>
    <button class="btn btn-desligar" id="btnDesligar">DESLIGAR</button>
  </div>

  <script src="lampada.js"></script>
</body>
</html>
