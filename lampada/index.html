<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lâmpada Interativa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <div class="lampada" id="lampada" role="button" tabindex="0" aria-label="Lâmpada. Clique para quebrar."
      aria-live="polite">
      <div class="bulbo"></div>
      <div class="base"></div>

      <!-- aria-hidden="true" oculta elementos decorativos de leitores de tela -->
      <div class="cacos" aria-hidden="true">
        <div class="caco c1"></div>
        <div class="caco c2"></div>
        <div class="caco c3"></div>
        <div class="caco c4"></div>
        <div class="caco c5"></div>
      </div>
    </div>

    <div class="controles">
      <button type="button" class="btn btn-ligar" id="btnLigar">Ligar</button>
      <button type="button" class="btn btn-desligar" id="btnDesligar">Desligar</button>
    </div>
  </main>

  <script src="lampada.js"></script>
</body>
</html>
